<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZetaCard</title>
</head>
<body>
<script>
(function(){
  const base="/visiting-card-app/";
  let u=window.location.pathname.startsWith(base)
    ? window.location.pathname.slice(base.length)
    : "";
  u=u.replace(/^\/+|\/+$/g,"");
  if(u&&!u.includes("/")&&/^[a-z0-9][a-z0-9-]{2,29}$/.test(u)){
    window.location.replace(base+"?u="+encodeURIComponent(u));
    return;
  }
  window.location.replace(base);
})();
</script>
</body>
</html>
