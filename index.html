<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZetaCard — Digital Visiting Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #536dfe;
      --dark: #172554;
      --text: #172033;
      --muted: #68738b;
      --border: #dfe5ef;
      --light: #f4f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        linear-gradient(
          135deg,
          #f5f7fb,
          #e9eef8
        );
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .primary-button {
      width: 100%;
      padding: 13px 18px;

      border-radius: 12px;

      background: var(--blue);
      color: white;

      font-weight: 700;
    }

    .secondary-button {
      padding: 13px 18px;

      border-radius: 12px;

      background: #edf1ff;
      color: #3d51b5;

      font-weight: 700;
    }

    .screen {
      min-height: 100vh;
    }

    /* =========================================
       BUILDER
    ========================================== */

    #builderScreen {
      width: min(1100px, 94%);
      margin: auto;

      padding: 32px 0 50px;
    }

    .builder-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .builder-header h1 {
      margin: 0 0 8px;

      font-size:
        clamp(
          2rem,
          5vw,
          3.2rem
        );
    }

    .builder-header p {
      margin: 0;
      color: var(--muted);
    }

    .builder-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(320px, 1fr);

      gap: 24px;
    }

    .panel {
      padding: 24px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 22px;

      box-shadow:
        0 18px 48px
        rgba(31, 48, 82, .08);
    }

    .panel h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-size: .9rem;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;

      padding: 12px 13px;

      border:
        1px solid
        #d3dae6;

      border-radius: 11px;

      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);

      box-shadow:
        0 0 0 3px
        rgba(83,109,254,.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .builder-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;

      margin-top: 18px;
    }

    .builder-buttons .primary-button {
      width: auto;
    }

    .status {
      min-height: 22px;

      margin-top: 10px;

      color: var(--blue);

      font-size: .9rem;
    }

    /* =========================================
       VISITING CARD
    ========================================== */

    .card-container {
      display: flex;
      justify-content: center;
    }

    .visiting-card {
      width: min(520px, 100%);
      min-height: 320px;

      padding: 34px;

      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          var(--dark),
          var(--blue)
        );

      color: white;

      box-shadow:
        0 26px 60px
        rgba(30,45,100,.24);

      display: flex;
      flex-direction: column;

      justify-content: space-between;

      overflow-wrap: anywhere;
    }

    .brand {
      font-size: .75rem;

      letter-spacing: .15em;

      text-transform: uppercase;

      opacity: .72;
    }

    .visiting-card h3 {
      margin: 11px 0 5px;

      font-size: 2.2rem;

      line-height: 1.05;
    }

    .role {
      font-weight: 700;
      opacity: .9;
    }

    .company {
      margin-top: 4px;
      opacity: .72;
    }

    .bio {
      margin: 22px 0;

      line-height: 1.55;

      opacity: .92;
    }

    .contact {
      display: grid;
      gap: 8px;
    }

    .contact a {
      color: white;
      text-decoration: none;

      opacity: .95;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    /* =========================================
       SHARED CARD
    ========================================== */

    #sharedScreen {
      display: none;

      min-height: 100vh;

      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .shared-wrapper {
      width: min(560px, 100%);

      text-align: center;
    }

    .zetacard-label {
      margin-bottom: 18px;

      color: var(--muted);

      font-size: .78rem;
      font-weight: 800;

      letter-spacing: .15em;
    }

    .shared-card {
      margin: auto;

      text-align: left;
    }

    .create-own-button {
      display: block;

      margin:
        22px
        auto
        0;

      padding: 12px 16px;

      border-radius: 11px;

      background:
        rgba(255,255,255,.13);

      border:
        1px solid
        rgba(255,255,255,.35);

      color: white;

      font-weight: 700;
    }

    .shared-note {
      margin-top: 15px;

      color: var(--muted);

      font-size: .82rem;
    }

    .profile-error {
      width: min(500px, 100%);

      padding: 30px;

      background: white;

      border:
        1px solid
        var(--border);

      border-radius: 20px;

      text-align: center;

      box-shadow:
        0 18px 45px
        rgba(31,48,82,.08);
    }

    /* =========================================
       NEW CARD CREATOR
    ========================================== */

    #creatorScreen {
      display: none;

      min-height: 100vh;

      padding: 25px;

      background:
        radial-gradient(
          circle at top left,
          #dce5ff 0,
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #f8faff,
          #edf2fb
        );
    }

    .creator-wrapper {
      width: min(1120px, 100%);

      margin: auto;
    }

    .creator-navigation {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 25px;
    }

    .back-button {
      padding: 11px 16px;

      border-radius: 11px;

      background: white;

      border:
        1px solid
        var(--border);

      color: #26335f;

      font-weight: 700;
    }

    .creator-label {
      color: var(--blue);

      font-size: .76rem;
      font-weight: 800;

      letter-spacing: .14em;
    }

    .creator-grid {
      display: grid;

      grid-template-columns:
        minmax(0,.8fr)
        minmax(360px,1.2fr);

      gap: 28px;

      align-items: start;
    }

    .creator-introduction {
      padding: 35px 15px;
    }

    .creator-badge {
      display: inline-block;

      padding: 7px 11px;

      border-radius: 999px;

      background: #eef2ff;

      color: #3d51b5;

      font-size: .74rem;

      font-weight: 800;

      letter-spacing: .12em;
    }

    .creator-introduction h1 {
      margin: 18px 0 12px;

      font-size:
        clamp(
          2.2rem,
          5vw,
          4rem
        );

      line-height: 1.03;
    }

    .creator-introduction p {
      max-width: 560px;

      color: var(--muted);

      font-size: 1.05rem;

      line-height: 1.65;
    }

    .steps {
      display: grid;

      gap: 12px;

      margin-top: 28px;
    }

    .step {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .step-number {
      width: 32px;
      height: 32px;

      flex: 0 0 32px;

      display: grid;
      place-items: center;

      border-radius: 50%;

      background: var(--blue);
