<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaCard - Digital Visiting Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue: #536dfe;
      --blue-dark: #172554;
      --text: #172033;
      --muted: #68738b;
      --border: #dfe5ef;
      --background: #eef2f7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #f5f7fb, #e9eef8);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .builder {
      width: min(1080px, 94%);
      margin: 0 auto;
      padding: 32px 0 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.1rem);
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .builder-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .panel {
      padding: 24px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(31, 48, 82, 0.08);
    }

    .panel h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d2d9e6;
      border-radius: 11px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.12);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .primary {
      border: 0;
      padding: 12px 18px;
      border-radius: 11px;
      background: var(--blue);
      color: #ffffff;
      font-weight: 700;
    }

    .secondary {
      border: 0;
      padding: 12px 18px;
      border-radius: 11px;
      background: #edf1ff;
      color: #3d51b5;
      font-weight: 700;
    }

    .status {
      min-height: 22px;
      margin-top: 10px;
      color: var(--blue);
      font-size: 0.9rem;
    }

    .card-wrap {
      display: flex;
      justify-content: center;
    }

    .card {
      width: min(520px, 100%);
      min-height: 320px;
      padding: 32px;
      border-radius: 28px;
      background: linear-gradient(145deg, var(--blue-dark), var(--blue));
      color: #ffffff;
      box-shadow: 0 24px 55px rgba(30, 45, 100, 0.24);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-wrap: anywhere;
    }

    .brand {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.72;
    }

    .card h3 {
      margin: 11px 0 4px;
      font-size: 2.2rem;
      line-height: 1.05;
    }

    .role {
      font-weight: 700;
      opacity: 0.9;
    }

    .company {
      margin-top: 4px;
      opacity: 0.72;
    }

    .bio {
      margin: 21px 0;
      line-height: 1.55;
      opacity: 0.92;
    }

    .contact {
      display: grid;
      gap: 8px;
    }

    .contact a {
      color: #ffffff;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    /* Shared profile */
    #sharedScreen {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shared-container {
      width: min(560px, 100%);
      text-align: center;
    }

    .shared-label {
      margin-bottom: 18px;
      color: var(--muted);
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
    }

    .create-own {
      display: block;
      margin: 22px auto 0;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 11px;
      background: rgba(255,255,255,0.12);
      color: white;
      font-weight: 700;
    }

    .shared-note {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* New card screen */
    #creatorScreen {
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at top left, #dce5ff 0, transparent 35%),
        linear-gradient(135deg, #f8faff, #edf2fb);
    }

    .creator-container {
      width: min(1100px, 100%);
      margin: 0 auto;
    }

    .creator-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 24px;
    }

    .back-button {
      padding: 11px 16px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #ffffff;
      color: #26335f;
      font-weight: 700;
    }

    .creator-label {
      color: var(--blue);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .creator-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 28px;
      align-items: start;
    }

    .creator-intro {
      padding: 25px 10px;
    }

    .badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3d51b5;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .creator-intro h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.03;
    }

    .creator-intro p {
      max-width: 540px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 1.05rem;
    }

    .steps {
      display: grid;
      gap: 12px;
      margin-top: 26px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 11px;
