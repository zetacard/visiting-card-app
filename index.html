<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZetaCard — Digital Visiting Card</title>

  <style>
    :root{
      --text:#172033;
      --muted:#657089;
      --line:#dfe5ef;
      --blue:#536dfe;
      --blue-dark:#172554;
      --soft:#eef2ff;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      background:
        linear-gradient(
          135deg,
          #f5f7fb,
          #e9eef8
        );
    }

    button,
    input,
    textarea{
      font:inherit;
    }

    button{
      border:0;
      border-radius:12px;
      padding:12px 16px;
      font-weight:700;
      cursor:pointer;
    }

    .primary{
      background:var(--blue);
      color:#fff;
    }

    .secondary{
      background:var(--soft);
      color:#3d51b5;
    }

    /* =========================
       MAIN BUILDER
    ========================== */

    .builder{
      width:min(1100px,94%);
      margin:auto;
      padding:32px 0 50px;
    }

    .builder-header{
      text-align:center;
      margin-bottom:26px;
    }

    .builder-header h1{
      margin:0 0 8px;
      font-size:
        clamp(
          2rem,
          5vw,
          3.2rem
        );
    }

    .builder-header p{
      margin:0;
      color:var(--muted);
    }

    .builder-grid{
      display:grid;
      grid-template-columns:
        minmax(0,1fr)
        minmax(320px,1fr);
      gap:24px;
      align-items:start;
    }

    .panel{
      background:
        rgba(255,255,255,.96);

      border:1px solid var(--line);

      border-radius:22px;

      padding:24px;

      box-shadow:
        0 18px 48px
        rgba(31,48,82,.08);
    }

    .panel h2{
      margin-top:0;
    }

    .field{
      margin-bottom:15px;
    }

    label{
      display:block;
      margin-bottom:7px;

      font-size:.9rem;
      font-weight:750;
    }

    input,
    textarea{
      width:100%;

      border:1px solid #d4dbe7;

      border-radius:11px;

      padding:12px 13px;

      background:#fff;
      color:var(--text);

      outline:none;
    }

    input:focus,
    textarea:focus{
      border-color:var(--blue);

      box-shadow:
        0 0 0 3px
        rgba(83,109,254,.12);
    }

    textarea{
      min-height:100px;
      resize:vertical;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;

      gap:10px;

      margin-top:18px;
    }

    .status{
      min-height:22px;

      margin-top:11px;

      color:var(--blue);

      font-size:.9rem;
    }

    /* =========================
       VISITING CARD
    ========================== */

    .card-area{
      display:flex;
      justify-content:center;
    }

    .visiting-card{
      width:min(520px,100%);

      min-height:320px;

      padding:34px;

      border-radius:28px;

      color:#fff;

      background:
        linear-gradient(
          145deg,
          var(--blue-dark),
          var(--blue)
        );

      box-shadow:
        0 26px 60px
        rgba(30,45,100,.24);

      display:flex;
      flex-direction:column;
      justify-content:space-between;

      overflow-wrap:anywhere;
    }

    .brand{
      font-size:.76rem;

      letter-spacing:.15em;

      text-transform:uppercase;

      opacity:.72;
    }

    .visiting-card h3{
      margin:11px 0 4px;

      font-size:2.2rem;

      line-height:1.05;
    }

    .role{
      font-weight:700;
      opacity:.9;
    }

    .company{
      margin-top:4px;
      opacity:.72;
    }

    .bio{
      margin:22px 0;

      line-height:1.55;

      opacity:.92;
    }

    .contact{
      display:grid;
      gap:8px;
    }

    .contact a{
      color:#fff;

      text-decoration:none;

      opacity:.94;
    }

    .contact a:hover{
      text-decoration:underline;
    }

    /* =========================
       SHARED CARD VIEW
    ========================== */

    #sharedView,
    #creatorView{
      min-height:100vh;
    }

    .shared-page{
      min-height:100vh;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:24px;
    }

    .shared-content{
      width:min(560px,100%);

      text-align:center;
    }

    .shared-brand{
      margin-bottom:18px;

      color:var(--muted);

      font-size:.78rem;

      font-weight:800;

      letter-spacing:.15em;
    }

    .shared-content .visiting-card{
      margin:auto;
      text-align:left;
    }

    .shared-note{
      margin-top:16px;

      color:var(--muted);

      font-size:.84rem;
    }

    .card-action{
      display:block;

      margin:20px auto 0;

      background:
        rgba(255,255,255,.12);

      color:#fff;

      border:
        1px solid
        rgba(255,255,255,.34);
    }

    /* =========================
       NEW CARD INTERFACE
    ========================== */

    .creator-page{
      min-height:100vh;

      padding:24px;

      background:
        radial-gradient(
          circle at top left,
          #dce5ff 0,
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #f8faff,
          #edf2fb
        );
    }

    .creator-shell{
      width:min(1120px,100%);

      margin:auto;
    }

    .creator-nav{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:16px;

      margin-bottom:24px;
    }

    .creator-back{
      background:#fff;

      color:#26335f;

      border:
        1px solid
        var(--line);
    }

    .creator-label{
      color:var(--blue);

      font-size:.76rem;

      font-weight:800;

      letter-spacing:.14em;
    }

    .creator-grid{
      display:grid;

      grid-template-columns:
        minmax(0,.8fr)
        minmax(360px,1.2fr);

      gap:28px;

      align-items:start;
    }

      padding:36px
